<body>
 <h2>Cálculo de Salário Bruto</h2>

  <form onsubmit="return calcularSalario();">
    <label for="nome">Nome do funcionário:</label>
    <input type="text" id="nome" placeholder="Digite o nome"><br><br>

    <label for="horas">Número de horas trabalhadas:</label>
    <input type="text" id="horas" placeholder="Ex: 160"><br><br>

    <label for="valorHora">Valor da hora (R$):</label>
    <input type="text" id="valorHora" placeholder="Ex: 25.50"><br><br>

    <input type="submit" value="Calcular Salário">
  </form>
  resultado:
  <p id="resultado"></p>

</body>
</html>

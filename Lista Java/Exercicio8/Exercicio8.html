<html>
<head>
    <link rel="stylesheet" href="estilo.css">
    <script src="script8.js"></script>
</head>
<body>
 <h2>Calculadora de Parcelamento</h2>

  <form onsubmit="return calcularParcelas();">
    <label for="nome">Nome do cliente:</label>
    <input type="text" id="nome" placeholder="Digite o nome"><br><br>

    <label for="total">Total da compra (R$):</label>
    <input type="text" id="total" placeholder="Ex: 1200.00"><br><br>

    <label for="parcelas">Número de parcelas:</label>
    <input type="text" id="parcelas" placeholder="Ex: 6"><br><br>

    <input type="submit" value="Calcular Parcelas">
  </form>
  Resultado:
  <p id="resultado"></p>

</body>
</html>

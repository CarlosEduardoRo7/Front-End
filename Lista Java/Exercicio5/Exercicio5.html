<html>
<head>
    <link rel="stylesheet" href="estilo.css">
    <script src="script5.js"></script>
</head>
<body>
<h2>Reajuste Salarial</h2>

  <form onsubmit="return calcularAumento();">
    <label for="nome">Nome do funcionário:</label>
    <input type="text" id="nome" placeholder="Digite o nome"><br><br>

    <label for="cargo">Cargo:</label>
    <input type="text" id="cargo" placeholder="Digite o cargo"><br><br>

    <label for="salario">Salário atual (R$):</label>
    <input type="text" id="salario" placeholder="Ex: 3500.00"><br><br>

    <input type="submit" value="Calcular Novo Salário">
  </form>
  Resultado:
  <p id="resultado"></p></body>
</html>

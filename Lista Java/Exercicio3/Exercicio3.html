<body>
<h2>Cálculo da Média do Aluno</h2>

  <form onsubmit="return calcularMedia();">
    <label for="nome">Nome do aluno:</label>
    <input type="text" id="nome" placeholder="Digite o nome"><br><br>

    <label for="nota1">Nota 1:</label>
    <input type="text" id="nota1" placeholder="Ex: 7.5"><br><br>

    <label for="nota2">Nota 2:</label>
    <input type="text" id="nota2" placeholder="Ex: 8.0"><br><br>

    <label for="nota3">Nota 3:</label>
    <input type="text" id="nota3" placeholder="Ex: 6.5"><br><br>

    <input type="submit" value="Calcular Média">
  </form>
  Resultado: <p id="resultado"></p>

</body>

<html>
<head>
    <link rel="stylesheet" href="estilo.css">
    <script src="script7.js"></script>
</head>
<body>
 <h2>Calculadora de IMC</h2>

  <form onsubmit="return calcularIMC();">
    <label for="nome">Nome:</label>
    <input type="text" id="nome" placeholder="Digite o nome"><br><br>

    <label for="idade">Idade:</label>
    <input type="text" id="idade" placeholder="Ex: 30"><br><br>

    <label for="peso">Peso (kg):</label>
    <input type="text" id="peso" placeholder="Ex: 70.5"><br><br>

    <label for="altura">Altura (m):</label>
    <input type="text" id="altura" placeholder="Ex: 1.75"><br><br>

    <input type="submit" value="Calcular IMC">
  </form>
  Resultado:
  <p id="resultado"></p>
</body>
</html>

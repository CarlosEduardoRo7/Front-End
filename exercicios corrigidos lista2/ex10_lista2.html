<body>
  <h1>Exercício10 - Lista 02 </h1>
   <h2>Cálculo de Salário com Horas Extras</h2>
    <label>Salário base (R$):</label>
    <input type="number" id="salarioBase" placeholder="Ex: 2500" step="0.01"><br>
    <label>Horas extras trabalhadas:</label>
    <input type="number" id="horasExtras" placeholder="Ex: 10"><br>
    <label>Valor da hora extra (R$):</label>
    <input type="number" id="valorHoraExtra" placeholder="Ex: 25" step="0.01"><br>
    <button onclick="calcularSalario()">Calcular Salário Total</button>
    <br><br>
    Resultado:
    <p id="resultado1"></p>
</body>
